<section
  class="overflow-hidden bg-surface py-12 sm:py-16 lg:py-28"
  aria-labelledby="about-company-heading"
>
  <div
    class="mx-auto grid max-w-7xl items-center gap-12 px-5 sm:px-6 lg:grid-cols-2 lg:gap-20 lg:px-8"
  >
    <!-- =========================
     IMAGE
========================== -->

    <div class="relative w-full max-w-xl mx-auto">
      <div class="overflow-hidden rounded-2xl shadow-xl sm:rounded-3xl">
        <img
          src="/assets/images/about/about-egypt.jpg"
          alt="Travelers exploring ancient Egyptian landmarks with a local guide"
          class="block aspect-[4/3] w-full object-cover sm:aspect-[16/10]"
          loading="lazy"
          width="800"
          height="500"
        />
      </div>

      <!-- Decorative corners -->

      <span
        aria-hidden="true"
        class="pointer-events-none absolute -left-1 -top-1 h-10 w-10 rounded-tl-2xl border-l-4 border-t-4 border-gold sm:h-14 sm:w-14 sm:rounded-tl-3xl"
      ></span>

      <span
        aria-hidden="true"
        class="pointer-events-none absolute -bottom-1 -right-1 h-10 w-10 rounded-br-2xl border-b-4 border-r-4 border-gold sm:h-14 sm:w-14 sm:rounded-br-3xl"
      ></span>
    </div>

    <!-- =========================
     CONTENT
========================== -->

    <div class="w-full min-w-0">
      <p
        class="mb-3 flex items-center gap-3 text-xs font-semibold uppercase tracking-[0.2em] text-gold sm:text-sm"
      >
        <span aria-hidden="true" class="h-px w-7 bg-gold"></span>

        About Our Company
      </p>

      <h2
        id="about-company-heading"
        class="text-2xl font-bold leading-tight text-dark-navy sm:text-3xl lg:text-4xl"
      >
        Your Trusted Partner for Egypt Travel
      </h2>

      <div
        class="mt-5 space-y-5 text-sm leading-7 text-gray-600 sm:mt-6 sm:text-base sm:leading-8"
        itemprop="text"
      >
        <p *ngFor="let paragraph of paragraphs" class="break-words">
          {{ paragraph }}
        </p>
      </div>
    </div>
  </div>
</section>
