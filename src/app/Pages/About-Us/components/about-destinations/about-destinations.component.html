<section
  class="overflow-hidden bg-surface py-12 sm:py-16 lg:py-28"
  aria-labelledby="destinations-heading"
>
  <div class="mx-auto max-w-7xl px-5 sm:px-6 lg:px-8">
    <!-- HEADER -->

    <div class="max-w-3xl">
      <p
        class="mb-3 flex items-center gap-3 text-xs font-semibold uppercase tracking-[0.2em] text-gold sm:text-sm"
      >
        <span aria-hidden="true" class="h-px w-7 bg-gold"></span>

        Explore Egypt
      </p>

      <h2
        id="destinations-heading"
        class="text-2xl font-bold leading-tight text-dark-navy sm:text-3xl lg:text-4xl"
      >
        Explore Egypt with Local Experts
      </h2>

      <p
        class="mt-4 max-w-2xl text-sm leading-7 text-gray-600 sm:text-base sm:leading-8"
      >
        From ancient monuments and historic cities to the Nile River and the Red
        Sea, our Egypt tours cover some of the country's most remarkable
        destinations.
      </p>
    </div>

    <!-- DESTINATIONS GRID -->

    <div
      class="mt-10 grid grid-cols-2 gap-3 sm:mt-12 sm:gap-5 md:grid-cols-3 lg:grid-cols-4"
    >
      <a
        *ngFor="let destination of destinations"
        [routerLink]="destination.url"
        class="group rounded-2xl border border-gray-200 bg-white p-4 text-center shadow-sm transition duration-300 hover:-translate-y-1 hover:border-gold hover:shadow-md sm:p-6"
      >
        <h3
          class="text-sm font-semibold text-dark-navy transition group-hover:text-gold sm:text-base"
        >
          {{ destination.name }}
        </h3>

        <p class="mt-1 text-xs text-gray-500">Egypt Tours</p>
      </a>
    </div>
  </div>
</section>
