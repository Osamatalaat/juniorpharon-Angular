<section
  class="overflow-hidden bg-dark-navy py-12 text-white sm:py-16 lg:py-24"
  aria-labelledby="services-heading"
>
  <div class="mx-auto max-w-7xl px-5 sm:px-6 lg:px-8">
    <!-- HEADER -->

    <div class="mx-auto max-w-3xl text-center">
      <p
        class="mb-3 text-xs font-semibold uppercase tracking-[0.2em] text-gold sm:text-sm"
      >
        Our Travel Services
      </p>

      <h2
        id="services-heading"
        class="text-2xl font-bold leading-tight sm:text-3xl lg:text-4xl"
      >
        Everything You Need for Your Egypt Vacation
      </h2>

      <p
        class="mt-4 text-sm leading-7 text-slate-300 sm:text-base sm:leading-8"
      >
        Our Egypt tour packages include accommodation, transportation,
        professional Egyptologist guides, Nile cruises, airport transfers,
        sightseeing tours, and personalized travel services.
      </p>
    </div>

    <!-- SERVICES CARDS -->

    <div class="mt-10 grid gap-5 sm:mt-14 sm:grid-cols-2 lg:grid-cols-3">
      <article
        *ngFor="let service of services"
        class="rounded-3xl border border-white/10 bg-white/5 p-6 transition duration-300 hover:-translate-y-1 hover:bg-white/10 sm:p-7"
      >
        <div
          class="mb-5 flex h-11 w-11 items-center justify-center rounded-full bg-gold text-dark-navy"
          aria-hidden="true"
        >
          <i [class]="service.icon"></i>
        </div>

        <h3 class="text-lg font-semibold">
          {{ service.title }}
        </h3>

        <p class="mt-3 text-sm leading-7 text-slate-300">
          {{ service.description }}
        </p>
      </article>
    </div>
  </div>
</section>
