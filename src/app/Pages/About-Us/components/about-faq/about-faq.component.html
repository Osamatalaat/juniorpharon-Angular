<section
  class="overflow-hidden bg-light-gray py-12 sm:py-16 lg:py-28"
  aria-labelledby="faq-heading"
  itemscope
  itemtype="https://schema.org/FAQPage"
>
  <div class="mx-auto max-w-5xl px-5 sm:px-6 lg:px-8">
    <!-- HEADER -->

    <div class="mx-auto max-w-3xl text-center">
      <p
        class="mb-3 flex items-center justify-center gap-3 text-xs font-semibold uppercase tracking-[0.2em] text-gold sm:text-sm"
      >
        <span aria-hidden="true" class="h-px w-7 bg-gold"></span>

        Frequently Asked Questions

        <span aria-hidden="true" class="h-px w-7 bg-gold"></span>
      </p>

      <h2
        id="faq-heading"
        class="text-2xl font-bold leading-tight text-dark-navy sm:text-3xl lg:text-4xl"
      >
        Egypt Tours – Frequently Asked Questions
      </h2>

      <p class="mt-4 text-sm leading-7 text-gray-600 sm:text-base">
        Find answers to common questions about Egypt tours, Nile cruises,
        private tours, accommodation, transportation, and customized travel
        experiences.
      </p>
    </div>

    <!-- FAQ ITEMS -->

    <div class="mt-10 space-y-4 sm:mt-12">
      <details
        *ngFor="let faq of faqs"
        class="group rounded-2xl border border-gray-200 bg-white shadow-sm"
        itemscope
        itemprop="mainEntity"
        itemtype="https://schema.org/Question"
      >
        <summary
          class="flex cursor-pointer list-none items-center justify-between gap-4 px-5 py-4 text-sm font-semibold text-dark-navy sm:px-6 sm:py-5 sm:text-base"
        >
          <span itemprop="name" class="leading-6">
            {{ faq.question }}
          </span>

          <span
            aria-hidden="true"
            class="flex h-8 w-8 flex-none items-center justify-center rounded-full bg-gold/10 text-gold transition duration-300 group-open:rotate-45"
          >
            <i class="fa-solid fa-plus"></i>
          </span>
        </summary>

        <div
          class="border-t border-gray-100 px-5 pb-5 pt-4 text-sm leading-7 text-gray-600 sm:px-6"
          itemscope
          itemprop="acceptedAnswer"
          itemtype="https://schema.org/Answer"
        >
          <p itemprop="text">
            {{ faq.answer }}
          </p>
        </div>
      </details>
    </div>
  </div>
</section>
