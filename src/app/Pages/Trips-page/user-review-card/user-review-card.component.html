<div class="mt-14 relative max-w-[1500px] mx-auto">

  <!-- Title -->
  <h2
    class="text-3xl font-bold text-dark-navy max-w-7xl mx-auto mb-8"
  >
    Traveler Reviews
  </h2>

  <!-- Left Arrow -->
  <button
    (click)="prev()"
    class="hidden lg:flex
           absolute left-0 top-1/2 -translate-y-1/2 z-10
           w-12 h-12
           items-center justify-center
           rounded-full
           bg-white
           border border-gray-200
           shadow-lg
           hover:bg-dark-navy
           hover:border-dark-navy
           transition-all duration-300
           group"
  >
    <i
      class="bx bx-chevron-left text-2xl text-dark-navy group-hover:text-gold">
    </i>
  </button>

  <!-- Right Arrow -->
  <button
    (click)="next()"
    class="hidden lg:flex
           absolute right-0 top-1/2 -translate-y-1/2 z-10
           w-12 h-12
           items-center justify-center
           rounded-full
           bg-white
           border border-gray-200
           shadow-lg
           hover:bg-dark-navy
           hover:border-dark-navy
           transition-all duration-300
           group"
  >
    <i
      class="bx bx-chevron-right text-2xl text-dark-navy group-hover:text-gold">
    </i>
  </button>

  <!-- Slider -->
  <div class="overflow-hidden max-w-7xl mx-auto">

    <div
      class="flex transition-transform duration-500 ease-in-out"
      [style.transform]="'translateX(-' + currentIndex * (100 / visibleCards) + '%)'"
    >

      <div
        *ngFor="let review of reviews"
        class="min-w-full sm:min-w-1/2 lg:min-w-1/3 px-3"
      >

        <div
          class="h-[210px]
                 bg-dark-navy
                 rounded-3xl
                 p-6
                 border border-gold/20
                 shadow-lg
                 hover:shadow-2xl
                 hover:-translate-y-1
                 transition-all duration-300
                 flex flex-col"
        >

          <!-- User -->
          <div class="flex items-center justify-between mb-4">

            <div class="flex items-center gap-3">

              <img
                [src]="review.image"
                class="w-14 h-14
                       rounded-full
                       object-cover
                       border-2 border-gold"
              />

              <div>

                <h3
                  class="text-white font-semibold text-base"
                >
                  {{ review.user }}
                </h3>

                <p
                  class="text-xs text-gold mt-1"
                >
                  {{ review.date }}
                </p>

              </div>

            </div>

            <!-- Rating -->

            <div class="flex gap-1 text-gold text-base">

              <ng-container
                *ngFor="let star of getStars(review.rating); let i = index">

                <i
                  class="bx"
                  [ngClass]="i < review.rating ? 'bxs-star' : 'bx-star'">
                </i>

              </ng-container>

            </div>

          </div>

          <!-- Review -->

          <p
            class="text-gray-300
                   leading-7
                   text-sm
                   line-clamp-4"
          >
            {{ review.comment }}
          </p>

        </div>

      </div>

    </div>

  </div>

</div>
