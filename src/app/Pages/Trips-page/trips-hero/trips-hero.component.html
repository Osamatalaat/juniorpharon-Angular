<section
  class="relative
         h-[380px]
         sm:h-[500px]
         lg:h-[600px]
         rounded-2xl lg:rounded-3xl
         overflow-hidden
         shadow-2xl
         my-6 lg:my-10"
>
  <!-- Background -->
  <img
    src="assets/images/trips-hero/nile.png"
    alt="Egypt"
    class="absolute inset-0 w-full h-full object-cover"
  />

  <!-- Overlay -->
  <div
    class="absolute inset-0 bg-gradient-to-r from-black/75 via-black/45 to-black/20"
  ></div>

  <!-- Content -->
  <div class="relative z-10 flex items-center h-full">

    <div class="container mx-auto px-5 sm:px-8 lg:px-12">

      <!-- Badge -->
      <div
        class="inline-flex items-center gap-2
               bg-white/15 backdrop-blur-md
               border border-white/20
               text-white
               px-3 sm:px-5
               py-2
               rounded-full
               mb-4 sm:mb-6"
      >
        <i class="fa-solid fa-location-dot text-light-orange"></i>

        <span class="text-[11px] sm:text-sm font-medium">
          Ancient Wonders
        </span>
      </div>

      <!-- Title -->
      <h1
        class="font-extrabold
               text-3xl
               sm:text-5xl
               lg:text-6xl
               leading-tight
               text-white
               max-w-4xl"
      >
        Discover the

        <span class="text-light-orange">
          Wonders
        </span>

        of Egypt
      </h1>

      <!-- Description -->
      <p
        class="mt-4
               text-sm
               sm:text-lg
               lg:text-xl
               leading-6
               sm:leading-8
               text-white/90
               max-w-2xl"
      >
        Explore timeless pyramids, breathtaking Nile cruises,
        golden deserts, and unforgettable adventures across Egypt.
      </p>

      <!-- Rating -->
      <div
        class="mt-5
               flex flex-wrap
               items-center
               gap-3
               text-white"
      >
        <div class="flex text-star text-sm sm:text-xl">
          <i class="fa-solid fa-star"></i>
          <i class="fa-solid fa-star"></i>
          <i class="fa-solid fa-star"></i>
          <i class="fa-solid fa-star"></i>
          <i class="fa-solid fa-star-half-stroke"></i>
        </div>

        <span
          class="text-xs
                 sm:text-base
                 font-medium"
        >
          4.9 / 5 • 10,000+ Happy Travelers
        </span>
      </div>

    </div>

  </div>

</section>
