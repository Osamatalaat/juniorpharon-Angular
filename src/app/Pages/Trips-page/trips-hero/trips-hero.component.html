<section
  class="relative
         h-[380px]
         sm:h-[500px]
         lg:h-[600px]
         rounded-2xl lg:rounded-3xl
         overflow-hidden
         shadow-2xl
         my-6 lg:my-10"
>
  <!-- Background -->
  <img
    src="assets/images/trips-hero/nile.png"
    alt="Egypt"
    class="absolute inset-0 w-full h-full object-cover"
  />

  <!-- Overlay -->
  <div
    class="absolute inset-0
           bg-gradient-to-r
           from-[#081B33]/95
           via-[#081B33]/75
           to-[#081B33]/35"
  ></div>

  <!-- Content -->
  <div class="relative z-10 flex items-center h-full">

    <div class="container mx-auto px-5 sm:px-8 lg:px-12">

      <!-- Badge -->
      <div
        class="inline-flex items-center gap-2
               px-5 py-2
               rounded-full
               bg-[#C8A45D]/15
               border border-[#C8A45D]/40
               backdrop-blur-xl
               text-white
               mb-6"
      >
        <i class="fa-solid fa-location-dot text-gold"></i>

        <span class="text-sm font-medium">
          Ancient Wonders
        </span>
      </div>

      <!-- Title -->
      <h1
        class="font-extrabold
               text-4xl
               sm:text-5xl
               lg:text-6xl
               leading-tight
               text-white
               max-w-4xl"
      >
        Discover the

        <span class="text-gold">
          Wonders
        </span>

        of Egypt
      </h1>

      <!-- Gold Line -->
      <div
        class="mt-5
               w-28
               h-1
               rounded-full
               bg-gradient-to-r
               from-gold
               to-transparent"
      ></div>

      <!-- Description -->
      <p
        class="mt-6
               text-base
               sm:text-lg
               lg:text-xl
               leading-8
               text-gray-200
               max-w-2xl"
      >
        Explore timeless pyramids, breathtaking Nile cruises,
        golden deserts, ancient temples, and unforgettable adventures
        across the heart of Egypt.
      </p>

      <!-- Buttons -->
      <div class="mt-8 flex flex-wrap gap-4">

        <button
          class="bg-gold
                 hover:bg-gold-hover
                 text-white
                 px-7 py-3
                 rounded-xl
                 font-semibold
                 shadow-xl
                 transition duration-300"
        >
          Explore Trips
        </button>

        <button
          class="border border-white/25
                 hover:border-gold
                 hover:text-gold
                 hover:bg-white/5
                 text-white
                 px-7 py-3
                 rounded-xl
                 transition duration-300"
        >
          Contact Us
        </button>

      </div>

      <!-- Rating -->
      <div
        class="mt-8
               flex flex-wrap
               items-center
               gap-4
               text-white"
      >
        <div class="flex text-gold text-lg">

          <i class="fa-solid fa-star"></i>
          <i class="fa-solid fa-star"></i>
          <i class="fa-solid fa-star"></i>
          <i class="fa-solid fa-star"></i>
          <i class="fa-solid fa-star-half-stroke"></i>

        </div>

        <span class="font-medium text-gray-200">
          4.9 / 5 • Trusted by 10,000+ Travelers
        </span>
      </div>

    </div>

  </div>

</section>
