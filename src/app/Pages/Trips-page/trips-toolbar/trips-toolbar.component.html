<div
  class="container mx-auto
         bg-white
         border border-gray-200
         rounded-2xl
         shadow-lg
         p-5
         mb-8
         flex flex-col lg:flex-row
         lg:items-center
         lg:justify-between
         gap-6">

  <!-- Left -->
  <div class="flex flex-col lg:flex-row lg:items-center gap-6 flex-1">

    <!-- Results -->
    <div class="shrink-0">

      <h2 class="text-2xl font-bold text-dark-navy">
        {{ totalTrips }} Trips Found
      </h2>

      <p class="text-gray-500 text-sm">
        Explore the best destinations across Egypt
      </p>

    </div>

    <div class="hidden lg:block h-12 w-px bg-gray-200"></div>

    <!-- Search -->
    <div class="relative flex-1">

      <i
        class="fa-solid fa-magnifying-glass
               absolute
               left-4
               top-1/2
               -translate-y-1/2
               text-gold">
      </i>

      <input
        type="text"
        [(ngModel)]="searchText"
        (input)="onSearchChange()"
        placeholder="Search by title, city or destination..."
        class="w-full
               pl-12
               pr-4
               py-3
               rounded-xl
               border border-gray-300
               bg-white
               text-dark-navy
               placeholder:text-gray-400
               focus:outline-none
               focus:ring-2
               focus:ring-gold
               focus:border-gold
               transition-all duration-300"/>

    </div>

  </div>

  <!-- Right -->
  <div class="flex items-center gap-3">

    <span class="text-sm font-medium text-gray-600 whitespace-nowrap">
      Sort By
    </span>

    <select
      [(ngModel)]="sortBy"
      (change)="onSortChange()"
      class="min-w-[220px]
             border border-gray-300
             rounded-xl
             px-4
             py-3
             bg-white
             text-dark-navy
             focus:outline-none
             focus:ring-2
             focus:ring-gold
             focus:border-gold
             transition-all duration-300">

      <option value="popular">Most Popular</option>
      <option value="lowPrice">Price: Low to High</option>
      <option value="highPrice">Price: High to Low</option>
      <option value="rating">Highest Rated</option>
      <option value="newest">Newest</option>

    </select>

  </div>

</div>
