<div
  (click)="goToDetails()"
  class="group cursor-pointer overflow-hidden rounded-2xl border border-gray-200 bg-white shadow-sm transition-all duration-300 hover:-translate-y-1 hover:border-gold hover:shadow-xl"
>
  <!-- ================= IMAGE ================= -->

  <div class="relative h-32 overflow-hidden sm:h-44 lg:h-52">
    <img
      [src]="trip.coverImage || 'https://via.placeholder.com/400'"
      [alt]="trip.title"
      class="h-full w-full object-cover transition duration-500 group-hover:scale-110"
    />

    <div
      class="absolute inset-0 bg-gradient-to-t from-black/30 to-transparent"
    ></div>
  </div>

  <!-- ================= CONTENT ================= -->

  <div class="p-3 sm:p-4 lg:p-5">
    <!-- TITLE -->

    <h3
      class="line-clamp-2 min-h-[40px] text-sm font-bold leading-5 text-dark-navy transition group-hover:text-gold sm:text-base lg:text-lg"
    >
      {{ trip.title }}
    </h3>

    <!-- INFO -->

    <div
      class="mt-3 flex flex-col gap-2 text-xs text-gray-600 sm:flex-row sm:items-center sm:justify-between"
    >
      <!-- Destination -->

      <div class="flex min-w-0 items-center gap-1">
        <i class="fa-solid fa-location-dot text-gold"></i>

        <span class="truncate">
          {{ trip.destination.name }}
        </span>
      </div>

      <!-- Duration -->

      <div class="flex items-center gap-1">
        <i class="fa-regular fa-clock text-gold"></i>

        <span>
          {{ trip.duration.value }}
          {{ trip.duration.unit }}
        </span>
      </div>
    </div>

    <!-- PRICE + RATING -->

    <div class="mt-4 flex items-center justify-between">
      <span class="text-base font-extrabold text-dark-navy sm:text-lg">
        <ng-container *ngIf="trip.price > 0"> ${{ trip.price }} </ng-container>
      </span>

      <div class="flex items-center gap-1 text-xs">
        <i class="fa-solid fa-star text-gold"></i>

        <span class="font-semibold text-dark-navy">
          {{ trip.rating || 0 }}
        </span>
      </div>
    </div>

    <!-- FOOTER -->

    <div
      class="mt-4 flex items-center justify-between border-t border-gray-200 pt-3"
    >
      <span
        class="text-xs font-semibold text-gold transition group-hover:tracking-wide sm:text-sm"
      >
        {{ "TRIP_LIST.DETAILS" | translate }}
      </span>

      <i
        class="fa-solid fa-arrow-right text-sm text-dark-navy transition-all duration-300 group-hover:translate-x-1 group-hover:text-gold"
      ></i>
    </div>
  </div>
</div>
