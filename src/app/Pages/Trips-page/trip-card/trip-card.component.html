<div
  (click)="goToDetails()"
  class="bg-white rounded-xl shadow-md hover:shadow-xl transition-all duration-300
         border border-border hover:border-blue
         overflow-hidden group cursor-pointer"
>
  <!-- 🖼️ Image -->
  <div class="relative overflow-hidden">

    <img
      [src]="trip?.coverImage || 'https://via.placeholder.com/400'"
      alt="trip"
      class="w-full h-52 object-cover transition duration-500 group-hover:scale-105"
    />

    <!-- Overlay -->
    <div
      class="absolute inset-0 bg-black/0 group-hover:bg-black/10 transition duration-300">
    </div>

    <!-- Discount -->
    <div
      *ngIf="trip?.discount"
      class="absolute top-3 right-3 bg-light-orange text-white text-xs px-3 py-1 rounded-full font-bold shadow">

      -{{ trip.discount }}%

    </div>

  </div>

  <!-- 📄 Content -->
  <div class="p-5">

    <!-- Title -->
    <h3
      class="text-text-primary font-bold text-lg mb-3 line-clamp-2 group-hover:text-blue transition-colors duration-300">

      {{ trip?.title || 'Trip Title' }}

    </h3>

    <!-- Info -->
    <div class="flex items-center justify-between text-sm mb-5">

      <!-- City -->
      <div class="flex items-center gap-1 text-blue">

        <i class="fas fa-map-marker-alt"></i>

        <span>{{ trip?.city }}</span>

      </div>

      <!-- Duration -->
      <div class="flex items-center gap-1 text-text-secondary">

        <i class="far fa-clock"></i>

        <span>
          {{ trip?.durationInDays }}
          {{ 'TRIP_LIST.DURATION' | translate }}
        </span>

      </div>

      <!-- Rating -->
      <div class="flex items-center gap-1">

        <i class="fas fa-star text-star"></i>

        <span class="text-text-primary font-semibold">

          {{ trip?.rating || 4.5 }}

        </span>

      </div>

    </div>

    <!-- Price -->
    <div class="flex items-center gap-3 mb-5">

      <span class="text-blue font-bold text-2xl">

        {{ trip?.price }} EGP

      </span>

      <span
        *ngIf="trip?.oldPrice"
        class="text-text-muted line-through">

        {{ trip.oldPrice }} EGP

      </span>

    </div>

    <!-- Bottom Link -->
    <div
      class="pt-4 border-t border-border flex items-center justify-between">

      <span
        class="text-blue font-semibold transition-colors duration-300 group-hover:text-blue-hover">

        {{ 'TRIP_LIST.DETAILS' | translate }}

      </span>

      <i
        class="fas fa-arrow-right text-blue transition-all duration-300 group-hover:translate-x-2 group-hover:text-blue-hover">
      </i>

    </div>

  </div>

</div>
