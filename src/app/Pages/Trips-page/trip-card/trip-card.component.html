<div
  (click)="goToDetails()"
  class="bg-white rounded-2xl shadow-md hover:shadow-2xl
         transition-all duration-500
         border border-gray-200
         hover:border-gold
         overflow-hidden
         group
         cursor-pointer
         hover:-translate-y-2"
>
  <!-- Image -->
  <div class="relative overflow-hidden">

    <img
      [src]="trip?.coverImage || 'https://via.placeholder.com/400'"
      alt="trip"
      class="w-full h-56 object-cover transition duration-700 group-hover:scale-110"
    />

    <!-- Overlay -->
    <div
      class="absolute inset-0
             bg-gradient-to-t
             from-black/30
             via-transparent
             to-transparent
             opacity-0
             group-hover:opacity-100
             transition duration-500">
    </div>

    <!-- Discount -->
    <div
      *ngIf="trip?.discount"
      class="absolute top-4 right-4
             bg-gold
             text-white
             text-xs
             font-bold
             px-3
             py-1
             rounded-full
             shadow-lg">

      -{{ trip.discount }}%

    </div>

  </div>

  <!-- Content -->
  <div class="p-6">

    <!-- Title -->
    <h3
      class="text-dark-navy
             font-bold
             text-xl
             mb-4
             line-clamp-2
             group-hover:text-gold
             transition">

      {{ trip?.title || 'Trip Title' }}

    </h3>

    <!-- Info -->
    <div class="flex items-center justify-between text-sm mb-5">

      <!-- City -->
      <div class="flex items-center gap-2 text-gold">

        <i class="fas fa-location-dot"></i>

        <span class="text-gray-700">
          {{ trip?.city }}
        </span>

      </div>

      <!-- Duration -->
      <div class="flex items-center gap-2 text-gray-500">

        <i class="far fa-clock"></i>

        <span>
          {{ trip?.durationInDays }}
          {{ 'TRIP_LIST.DURATION' | translate }}
        </span>

      </div>

      <!-- Rating -->
      <div class="flex items-center gap-1">

        <i class="fas fa-star text-gold"></i>

        <span class="font-semibold text-dark-navy">
          {{ trip?.rating || 4.5 }}
        </span>

      </div>

    </div>

    <!-- Price -->
    <div class="flex items-center gap-3 mb-6">

      <span
        class="text-3xl
               font-extrabold
               text-dark-navy">

        {{ trip?.price }} EGP

      </span>

      <span
        *ngIf="trip?.oldPrice"
        class="text-gray-400 line-through">

        {{ trip.oldPrice }} EGP

      </span>

    </div>

    <!-- Bottom -->
    <div
      class="pt-4
             border-t border-gray-200
             flex items-center justify-between">

      <span
        class="font-semibold
               text-gold
               group-hover:tracking-wide
               transition-all">

        {{ 'TRIP_LIST.DETAILS' | translate }}

      </span>

      <i
        class="fas fa-arrow-right
               text-dark-navy
               group-hover:text-gold
               group-hover:translate-x-2
               transition-all duration-300">
      </i>

    </div>

  </div>

</div>
