<div class="md:hidden mb-3">

  <button
    (click)="toggleFilter()"
    class="w-full
           bg-dark-navy
           text-white
           text-sm
           font-semibold741
           *0           py-2.5
           rounded-xl
           hover:bg-navy
           transition
           shadow-md"
  >

    <i class="fa-solid fa-sliders mr-2 text-gold"></i>

    {{ showFilter ? "Hide Filters" : "Show Filters" }}

  </button>

</div>

<!-- Sidebar -->

<div
  *ngIf="showFilter || isDesktop"
  class="sticky
         top-24
         self-start
         max-w-[300px]
         bg-white
         border
         border-gray-200
         rounded-2xl
         shadow-lg
         overflow-hidden"
>

  <!-- Header -->

  <div
    class="bg-dark-navy
           px-4
           py-3
           text-white"
  >

    <div class="flex items-center gap-3">

      <div
        class="w-9
               h-9
               rounded-xl
               bg-gold/10
               border border-gold/20
               flex
               items-center
               justify-center"
      >

        <i class="fa-solid fa-sliders text-gold text-base"></i>

      </div>

      <div>

        <h3 class="text-lg font-bold">

          Filter Trips

        </h3>

        <p class="text-[11px] text-gray-300">

          Find your trip

        </p>

      </div>

    </div>

  </div>

  <div class="p-4 space-y-4">

    <!-- LOCATION -->

    <div class="pb-4 border-b border-gray-200">

      <h4
        class="flex
               items-center
               gap-2
               text-sm
               font-bold
               text-dark-navy
               mb-3"
      >

        <div
          class="w-8
                 h-8
                 rounded-lg
                 bg-gold/10
                 flex
                 items-center
                 justify-center"
        >

          <i class="fa-solid fa-location-dot text-gold text-xs"></i>

        </div>

        <span>

          Location

        </span>

      </h4>

      <select
        [(ngModel)]="selectedCountry"
        (change)="onCountryChange()"
        class="w-full
               rounded-lg
               border
               border-gray-300
               px-3
               py-2
               text-sm
               focus:ring-2
               focus:ring-gold
               focus:border-gold
               outline-none"
      >

        <option value="">
          Select Country
        </option>

        <option
          *ngFor="let country of countries"
          [value]="country.value"
        >
          {{ country.name }}
        </option>

      </select>

    </div>
        <!-- CITIES -->

    <div class="pb-4 border-b border-gray-200">

      <h4
        class="flex
               items-center
               gap-2
               text-sm
               font-bold
               text-dark-navy
               mb-3"
      >

        <div
          class="w-8
                 h-8
                 rounded-lg
                 bg-gold/10
                 flex
                 items-center
                 justify-center"
        >

          <i class="fa-solid fa-city text-gold text-xs"></i>

        </div>

        <span>Cities</span>

      </h4>

      <div class="space-y-1 max-h-44 overflow-y-auto pr-1">

        <label
          *ngFor="let city of cities"
          [for]="city"
          class="flex
                 items-center
                 gap-2
                 px-2
                 py-2
                 rounded-lg
                 hover:bg-gold/5
                 transition
                 cursor-pointer"
        >

          <input
            type="checkbox"
            [id]="city"
            (change)="toggleCity(city,$event)"
            class="accent-gold w-3.5 h-3.5"
          />

          <span class="text-sm text-dark-navy">

            {{ city }}

          </span>

        </label>

      </div>

    </div>

    <!-- PRICE -->

    <div class="pb-4 border-b border-gray-200">

      <h4 class="flex justify-between items-center mb-3">

        <span
          class="flex
                 items-center
                 gap-2
                 text-sm
                 font-bold
                 text-dark-navy"
        >

          <div
            class="w-8
                   h-8
                   rounded-lg
                   bg-gold/10
                   flex
                   items-center
                   justify-center"
          >

            <i class="fa-solid fa-money-bill-wave text-gold text-xs"></i>

          </div>

          Price

        </span>

        <span class="text-gold text-sm font-bold">

          {{ minPrice }} - {{ maxPrice }}

        </span>

      </h4>

      <div
        class="bg-gray-50
               border
               border-gray-200
               rounded-xl
               p-3"
      >

        <div class="relative h-2">

          <div
            class="absolute
                   w-full
                   h-2
                   bg-gray-300
                   rounded-full"
          ></div>

          <div
            class="absolute
                   h-2
                   bg-gold
                   rounded-full"
            [style.left.%]="(minPrice / 1000) * 100"
            [style.width.%]="((maxPrice - minPrice) / 1000) * 100"
          ></div>

          <input
            type="range"
            [min]="0"
            [max]="1000"
            [(ngModel)]="minPrice"
            (input)="minPriceChanged()"
            class="range-slider"
          />

          <input
            type="range"
            [min]="0"
            [max]="1000"
            [(ngModel)]="maxPrice"
            (input)="maxPriceChanged()"
            class="range-slider"
          />

        </div>

      </div>

    </div>
   <!-- DURATION -->

<div class="pb-4 border-b border-gray-200">

  <h4
    class="flex items-center gap-2
           text-sm font-bold
           text-dark-navy mb-3"
  >

    <div
      class="w-8 h-8
             rounded-lg
             bg-gold/10
             flex items-center justify-center"
    >

      <i class="fa-regular fa-clock text-gold text-xs"></i>

    </div>

    Duration

  </h4>


  <div class="space-y-1">


    <!-- 1 Day -->

    <label
      class="flex items-center gap-2
             px-2 py-1.5
             rounded-lg
             hover:bg-gold/5
             transition cursor-pointer"
    >

      <input
        type="checkbox"
        [checked]="durationMin === 1 && durationMax === 1"
        (change)="selectDuration(1, 1, 'days')"
        class="accent-gold w-3.5 h-3.5"
      />

      <span class="text-sm text-dark-navy">
        1 Day
      </span>

    </label>


    <!-- 2 - 3 Days -->

    <label
      class="flex items-center gap-2
             px-2 py-1.5
             rounded-lg
             hover:bg-gold/5
             transition cursor-pointer"
    >

      <input
        type="checkbox"
        [checked]="durationMin === 2 && durationMax === 3"
        (change)="selectDuration(2, 3, 'days')"
        class="accent-gold w-3.5 h-3.5"
      />

      <span class="text-sm text-dark-navy">
        2 - 3 Days
      </span>

    </label>


    <!-- 4 - 7 Days -->

    <label
      class="flex items-center gap-2
             px-2 py-1.5
             rounded-lg
             hover:bg-gold/5
             transition cursor-pointer"
    >

      <input
        type="checkbox"
        [checked]="durationMin === 4 && durationMax === 7"
        (change)="selectDuration(4, 7, 'days')"
        class="accent-gold w-3.5 h-3.5"
      />

      <span class="text-sm text-dark-navy">
        4 - 7 Days
      </span>

    </label>


    <!-- +7 Days -->

    <label
      class="flex items-center gap-2
             px-2 py-1.5
             rounded-lg
             hover:bg-gold/5
             transition cursor-pointer"
    >

      <input
        type="checkbox"
        [checked]="durationMin === 8 && durationMax === undefined"
        (change)="selectDuration(8, undefined, 'days')"
        class="accent-gold w-3.5 h-3.5"
      />

      <span class="text-sm text-dark-navy">
        +7 Days
      </span>

    </label>


  </div>

</div>
