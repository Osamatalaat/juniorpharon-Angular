<section class="py-16 bg-gradient-to-b from-slate-50 to-white">

  <div class="container mx-auto px-6">

    <!-- ================= Header ================= -->

    <div class="text-center max-w-3xl mx-auto mb-14">

      <span
        class="inline-flex items-center gap-2 rounded-full bg-gold/10 px-5 py-2 text-gold font-semibold">

        <i class="fa-solid fa-location-dot"></i>

        Explore Egypt

      </span>

      <h1
        class="mt-6 text-4xl lg:text-5xl font-black text-dark-navy">

        Discover Egypt's Top Destinations

      </h1>

      <p
        class="mt-5 text-lg text-gray-600 leading-8">

        Select any city on the map to explore its most famous attractions and
        historical landmarks.

      </p>

    </div>

    <!-- ================= Content ================= -->

    <div
      class="grid xl:grid-cols-[1.5fr_420px] gap-10 items-start">

      <!-- ================= Map ================= -->

     <div
  class="relative
         bg-white
         
         shadow-xl
         p-2
         sm:p-4
         lg:p-6">

        <img
          src="assets/images/egypt-map.png"
          alt="Egypt Map"
          class="w-full select-none">

        <!-- ================= Pins ================= -->

        <button
          *ngFor="let city of cities"
          (click)="selectCity(city)"
          [style.left]="city.x"
          [style.top]="city.y"
          class="absolute
                 -translate-x-1/2
                 -translate-y-1/2
                 group">

          <div
            class="flex
                   flex-col
                   items-center">

            <div
              class="w-6
                     h-6
                     rounded-full
                     bg-red-600
                     border-4
                     border-white
                     shadow-lg
                     transition
                     duration-300
                     group-hover:scale-125">

            </div>

            <span
              class="mt-2
                     whitespace-nowrap
                     rounded-full
                     bg-dark-navy
                     px-3
                     py-1
                     text-xs
                     font-semibold
                     text-white
                     shadow-lg">

              {{city.name}}

            </span>

          </div>

        </button>

      </div>

      <!-- ================= Right Card ================= -->

      <div
        class="rounded-3xl
               bg-white
               shadow-xl
               overflow-hidden">

        <!-- Image -->

        <img
          [src]="selectedCity.image"
          [alt]="selectedCity.name"
          class="h-64
                 w-full
                 object-cover">

        <!-- Body -->

        <div class="p-7">

          <div
            class="inline-flex
                   items-center
                   gap-2
                   rounded-full
                   bg-gold/10
                   px-4
                   py-2
                   text-gold
                   font-semibold">

            <i class="fa-solid fa-location-dot"></i>

            {{selectedCity.name}}

          </div>

          <h2
            class="mt-6
                   text-3xl
                   font-black
                   text-dark-navy">

            {{selectedCity.name}}

          </h2>

          <p
            class="mt-5
                   leading-8
                   text-gray-600">

            {{selectedCity.description}}

          </p>

          <!-- Places -->

          <h3
            class="mt-8
                   mb-4
                   text-xl
                   font-bold
                   text-dark-navy">

            Top Attractions

          </h3>

          <div
            class="space-y-3">

            <div
              *ngFor="let place of selectedCity.places"
              class="flex
                     items-center
                     justify-between
                     rounded-2xl
                     border
                     border-gray-100
                     px-4
                     py-3
                     hover:bg-gray-50
                     transition">

              <div>

                <h4
                  class="font-semibold
                         text-dark-navy">

                  {{place.name}}

                </h4>

                <p
                  class="text-sm
                         text-gray-500">

                  {{place.type}}

                </p>

              </div>

              <i
                class="fa-solid
                       fa-chevron-right
                       text-gold">

              </i>

            </div>

          </div>

          <!-- Button -->

          <button
            class="mt-8
                   w-full
                   rounded-2xl
                   bg-gold
                   py-4
                   text-lg
                   font-bold
                   text-dark-navy
                   transition
                   hover:bg-yellow-500">

            Explore Destination

          </button>

        </div>

      </div>

    </div>

  </div>

</section>
