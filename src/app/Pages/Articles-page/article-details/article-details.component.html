<section class="container mx-auto py-20">


<!-- LOADING -->

<div

*ngIf="loading"

class="text-center"

>

Loading...

</div>





<!-- ARTICLE -->

<article

*ngIf="article"


class="max-w-5xl mx-auto"

>



<!-- TITLE -->

<div class="text-center mb-10">


<h1

class="text-4xl md:text-5xl font-bold text-dark-navy leading-tight"

>

{{article.title}}

</h1>



<p

class="mt-5 text-gray-600"

>

{{article.excerpt}}

</p>


</div>





<!-- COVER IMAGE -->


<img

[src]="article.coverImage"

[alt]="article.title"

class="w-full h-[450px] object-cover rounded-3xl mb-12"

/>






<!-- CONTENT -->


<div class="space-y-10">



<section

*ngFor="let section of article.content"

>


<h2

class="text-2xl font-bold text-dark-navy mb-4"

>

{{section.heading}}

</h2>





<!-- Paragraphs -->

<p

*ngFor="let paragraph of section.paragraphs"

class="text-gray-700 leading-8 mb-3"

>

{{paragraph}}

</p>





<!-- Points -->

<ul

*ngIf="section.points"

class="space-y-3"

>


<li

*ngFor="let point of section.points"

class="flex gap-3 text-gray-700"

>


<i class="fa-solid fa-check text-gold mt-1"></i>


<span>

{{point}}

</span>


</li>


</ul>



</section>



</div>




</article>






<!-- RELATED ARTICLES -->


<section

*ngIf="relatedArticles.length"

class="mt-20"

>


<h2

class="text-3xl font-bold text-dark-navy text-center mb-10"

>

Related Articles

</h2>



<div

class="grid md:grid-cols-3 gap-8"

>


<app-article-card

*ngFor="let item of relatedArticles"

[article]="item"

>

</app-article-card>


</div>


</section>



</section>
