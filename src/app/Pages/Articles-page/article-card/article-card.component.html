<article

class="group bg-white rounded-2xl overflow-hidden shadow-card transition-all duration-300 hover:-translate-y-2 hover:shadow-xl"

>


<!-- ================= IMAGE ================= -->

<div class="relative overflow-hidden">


<img

[src]="article.coverImage"

[alt]="article.title"

class="w-full h-64 object-cover transition duration-700 group-hover:scale-110"

/>



<!-- Category Badge -->

<div

class="absolute top-4 left-4 bg-dark-navy/90 text-white px-4 py-1 rounded-full text-sm"

>

{{article.category}}

</div>



</div>





<!-- ================= CONTENT ================= -->


<div class="p-6 flex flex-col h-full">



<h2

class="text-xl font-bold text-dark-navy leading-7 mb-3 group-hover:text-gold transition"

>

{{article.title}}

</h2>




<p

class="text-text-secondary text-sm leading-7 line-clamp-3"

>

{{article.excerpt}}

</p>




<!-- READ MORE -->

<div class="mt-6">


<a

[routerLink]="['/articles',article.slug]"

class="inline-flex items-center gap-2 text-gold font-semibold transition group-hover:translate-x-1"

>


Read More


<i class="fa-solid fa-arrow-right"></i>


</a>


</div>



</div>



</article>
