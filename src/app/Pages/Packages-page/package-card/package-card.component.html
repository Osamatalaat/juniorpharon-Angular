<div
  (click)="goToDetails()"
  class="
    group
    cursor-pointer
    overflow-hidden
    rounded-xl
    border
    border-border
    bg-white
    shadow-sm
    transition-all
    duration-300
    hover:-translate-y-1
    hover:shadow-lg
  "
>


<!-- ================= IMAGE ================= -->

<div
  class="
    relative
    h-32
    overflow-hidden
    sm:h-44
  "
>

<img
  [src]="package.coverImage || 'https://via.placeholder.com/400'"
  [alt]="package.title"
  class="
    h-full
    w-full
    object-cover
    transition
    duration-500
    group-hover:scale-110
  "
/>


<span
  *ngIf="package.type?.length"
  class="
    absolute
    left-2
    top-2
    rounded-full
    bg-gold
    px-2
    py-1
    text-[10px]
    font-semibold
    text-dark-navy
    sm:px-3
    sm:text-xs
  "
>
  {{ package.type[0] }}
</span>


</div>





<!-- ================= CONTENT ================= -->

<div
  class="
    p-3
    sm:p-4
  "
>


<h3
  class="
    line-clamp-2
    min-h-[40px]
    text-sm
    font-bold
    leading-5
    text-heading
    transition
    group-hover:text-gold
    sm:text-base
  "
>

{{ package.title }}

</h3>






<!-- INFO -->

<div
  class="
    mt-3
    flex
    flex-col
    gap-1
    text-xs
    text-text-secondary
    sm:flex-row
    sm:items-center
    sm:justify-between
  "
>


<span
  class="
    flex
    items-center
    gap-1
    truncate
  "
>

<i class="fa-regular fa-clock text-gold"></i>

{{ package.duration.text }}

</span>




<span
  class="
    flex
    items-center
    gap-1
    truncate
  "
>

<i class="fa-solid fa-location-dot text-gold"></i>

{{ package.destination.name }}

</span>


</div>







<!-- ================= FOOTER ================= -->

<div
  class="
    mt-4
    flex
    items-center
    justify-between
    gap-2
    border-t
    border-border
    pt-3
  "
>



<!-- PRICE -->

<span
  class="
    max-w-[50%]
    truncate
    text-sm
    font-bold
    text-gold
    sm:text-lg
  "
>

<ng-container
  *ngIf="package.price > 0"
>

{{ package.price }} EGP

</ng-container>

</span>







<!-- DETAILS RIGHT + ARROW LEFT -->

<div
  class="
    flex
    items-center
    gap-2
    text-xs
    font-semibold
    text-text-secondary
    transition
    group-hover:text-gold
    sm:text-sm
  "
>


<i
  class="
    fa-solid
    fa-arrow-right
    text-[11px]
    transition-transform
    duration-300
    group-hover:translate-x-1
  "
></i>



<span>
  {{ 'PACKAGES.DETAILS' | translate }}
</span>


</div>



</div>



</div>


</div>
