
<!-- ===================================================== -->
<!-- MOBILE FILTER BUTTON -->
<!-- ===================================================== -->

<div class="md:hidden mb-3">

  <button
    (click)="toggleFilter()"
    class="
      w-full
      bg-dark-navy
      text-white
      text-sm
      font-semibold
      py-2.5
      rounded-xl
      hover:bg-navy
      transition
      shadow-md
    "
  >

    <i class="fa-solid fa-sliders mr-2 text-gold"></i>

    {{ showFilter ? 'Hide Filters' : 'Show Filters' }}

  </button>

</div>


<!-- ===================================================== -->
<!-- SIDEBAR -->
<!-- ===================================================== -->

<div
  *ngIf="showFilter || isDesktop"
  class="
    sticky
    top-24
    self-start
    max-w-[300px]
    w-full
    bg-white
    border
    border-gray-200
    rounded-2xl
    shadow-lg
    overflow-hidden
  "
>


  <!-- =================================================== -->
  <!-- HEADER -->
  <!-- =================================================== -->

  <div
    class="
      bg-dark-navy
      px-4
      py-3
      text-white
    "
  >

    <div class="flex items-center gap-3">

      <div
        class="
          w-9
          h-9
          rounded-xl
          bg-gold/10
          border
          border-gold/20
          flex
          items-center
          justify-center
        "
      >

        <i
          class="
            fa-solid
            fa-sliders
            text-gold
            text-base
          "
        ></i>

      </div>


      <div>

        <h3 class="text-lg font-bold">

          Filter Packages

        </h3>

        <p class="text-[11px] text-gray-300">

          Find your perfect package

        </p>

      </div>

    </div>

  </div>


  <!-- =================================================== -->
  <!-- FILTER BODY -->
  <!-- =================================================== -->

  <div class="p-4 space-y-4">


    <!-- ================================================= -->
    <!-- PRICE -->
    <!-- ================================================= -->

    <div class="pb-4 border-b border-gray-200">

      <h4
        class="
          flex
          items-center
          gap-2
          text-sm
          font-bold
          text-dark-navy
          mb-3
        "
      >

        <div
          class="
            w-8
            h-8
            rounded-lg
            bg-gold/10
            flex
            items-center
            justify-center
          "
        >

          <i
            class="
              fa-solid
              fa-money-bill-wave
              text-gold
              text-xs
            "
          ></i>

        </div>

        <span>

          Price

        </span>

      </h4>


      <select
        [(ngModel)]="selectedPriceRange"
        class="
          w-full
          rounded-lg
          border
          border-gray-300
          px-3
          py-2
          text-sm
          bg-white
          focus:ring-2
          focus:ring-gold
          focus:border-gold
          outline-none
          cursor-pointer
        "
      >

        <option [ngValue]="null">

          All Prices

        </option>


        <option
          *ngFor="let item of priceOptions"
          [ngValue]="item"
        >

          {{ item.label }}

        </option>

      </select>

    </div>


    <!-- ================================================= -->
    <!-- DURATION -->
    <!-- ================================================= -->

    <div class="pb-4 border-b border-gray-200">

      <h4
        class="
          flex
          items-center
          gap-2
          text-sm
          font-bold
          text-dark-navy
          mb-3
        "
      >

        <div
          class="
            w-8
            h-8
            rounded-lg
            bg-gold/10
            flex
            items-center
            justify-center
          "
        >

          <i
            class="
              fa-regular
              fa-clock
              text-gold
              text-xs
            "
          ></i>

        </div>

        Duration

      </h4>


      <div class="space-y-1">


        <!-- ================================================= -->
        <!-- 1 - 3 DAYS -->
        <!-- ================================================= -->

        <label
          class="
            flex
            items-center
            gap-2
            px-2
            py-1.5
            rounded-lg
            hover:bg-gold/5
            transition
            cursor-pointer
          "
        >

          <input
            type="checkbox"
            [checked]="
              filters.durationMin === 1 &&
              filters.durationMax === 3
            "
            (change)="
              selectDuration(1, 3, 'days')
            "
            class="
              accent-gold
              w-3.5
              h-3.5
            "
          />

          <span class="text-sm text-dark-navy">

            1 - 3 Days

          </span>

        </label>


        <!-- ================================================= -->
        <!-- 4 - 7 DAYS -->
        <!-- ================================================= -->

        <label
          class="
            flex
            items-center
            gap-2
            px-2
            py-1.5
            rounded-lg
            hover:bg-gold/5
            transition
            cursor-pointer
          "
        >

          <input
            type="checkbox"
            [checked]="
              filters.durationMin === 4 &&
              filters.durationMax === 7
            "
            (change)="
              selectDuration(4, 7, 'days')
            "
            class="
              accent-gold
              w-3.5
              h-3.5
            "
          />

          <span class="text-sm text-dark-navy">

            4 - 7 Days

          </span>

        </label>


        <!-- ================================================= -->
        <!-- 8 - 14 DAYS -->
        <!-- ================================================= -->

        <label
          class="
            flex
            items-center
            gap-2
            px-2
            py-1.5
            rounded-lg
            hover:bg-gold/5
            transition
            cursor-pointer
          "
        >

          <input
            type="checkbox"
            [checked]="
              filters.durationMin === 8 &&
              filters.durationMax === 14
            "
            (change)="
              selectDuration(8, 14, 'days')
            "
            class="
              accent-gold
              w-3.5
              h-3.5
            "
          />

          <span class="text-sm text-dark-navy">

            8 - 14 Days

          </span>

        </label>


        <!-- ================================================= -->
        <!-- +14 DAYS -->
        <!-- ================================================= -->

        <label
          class="
            flex
            items-center
            gap-2
            px-2
            py-1.5
            rounded-lg
            hover:bg-gold/5
            transition
            cursor-pointer
          "
        >

          <input
            type="checkbox"
            [checked]="
              filters.durationMin === 15 &&
              filters.durationMax === undefined
            "
            (change)="
              selectDuration(15, undefined, 'days')
            "
            class="
              accent-gold
              w-3.5
              h-3.5
            "
          />

          <span class="text-sm text-dark-navy">

            +14 Days

          </span>

        </label>


      </div>

    </div>


    <!-- ================================================= -->
    <!-- RATING -->
    <!-- ================================================= -->

    <div class="pb-4 border-b border-gray-200">

      <h4
        class="
          flex
          items-center
          gap-2
          text-sm
          font-bold
          text-dark-navy
          mb-3
        "
      >

        <div
          class="
            w-8
            h-8
            rounded-lg
            bg-gold/10
            flex
            items-center
            justify-center
          "
        >

          <i
            class="
              fa-solid
              fa-star
              text-gold
              text-xs
            "
          ></i>

        </div>

        Rating

      </h4>


      <div class="space-y-1">


        <!-- ================================================= -->
        <!-- 5 -->
        <!-- ================================================= -->

        <label
          class="
            flex
            justify-between
            items-center
            px-2
            py-1.5
            rounded-lg
            hover:bg-gold/5
            transition
            cursor-pointer
          "
        >

          <div class="flex items-center gap-2">

            <input
              type="checkbox"
              [checked]="filters.rating === 5"
              (change)="selectRating(5)"
              class="
                accent-gold
                w-3.5
                h-3.5
              "
            />


            <div class="flex text-gold text-xs">

              <i class="fa-solid fa-star"></i>
              <i class="fa-solid fa-star"></i>
              <i class="fa-solid fa-star"></i>
              <i class="fa-solid fa-star"></i>
              <i class="fa-solid fa-star"></i>

            </div>

          </div>


          <span
            class="
              text-xs
              font-semibold
              text-dark-navy
            "
          >

            5.0

          </span>

        </label>


        <!-- ================================================= -->
        <!-- 4+ -->
        <!-- ================================================= -->

        <label
          class="
            flex
            justify-between
            items-center
            px-2
            py-1.5
            rounded-lg
            hover:bg-gold/5
            transition
            cursor-pointer
          "
        >

          <div class="flex items-center gap-2">

            <input
              type="checkbox"
              [checked]="filters.rating === 4"
              (change)="selectRating(4)"
              class="
                accent-gold
                w-3.5
                h-3.5
              "
            />


            <div class="flex text-gold text-xs">

              <i class="fa-solid fa-star"></i>
              <i class="fa-solid fa-star"></i>
              <i class="fa-solid fa-star"></i>
              <i class="fa-solid fa-star"></i>

            </div>

          </div>


          <span class="text-xs text-dark-navy">

            4+

          </span>

        </label>


        <!-- ================================================= -->
        <!-- 3+ -->
        <!-- ================================================= -->

        <label
          class="
            flex
            justify-between
            items-center
            px-2
            py-1.5
            rounded-lg
            hover:bg-gold/5
            transition
            cursor-pointer
          "
        >

          <div class="flex items-center gap-2">

            <input
              type="checkbox"
              [checked]="filters.rating === 3"
              (change)="selectRating(3)"
              class="
                accent-gold
                w-3.5
                h-3.5
              "
            />


            <div class="flex text-gold text-xs">

              <i class="fa-solid fa-star"></i>
              <i class="fa-solid fa-star"></i>
              <i class="fa-solid fa-star"></i>

            </div>

          </div>


          <span class="text-xs text-dark-navy">

            3+

          </span>

        </label>


      </div>

    </div>


    <!-- ================================================= -->
    <!-- BUTTONS -->
    <!-- ================================================= -->

    <div class="space-y-2">


      <!-- APPLY -->

      <button
        (click)="applyFilters()"
        class="
          w-full
          bg-dark-navy
          hover:bg-navy
          text-white
          text-sm
          py-2.5
          rounded-xl
          font-semibold
          transition
        "
      >

        <i
          class="
            fa-solid
            fa-magnifying-glass
            mr-2
            text-gold
          "
        ></i>

        Apply Filters

      </button>


      <!-- RESET -->

      <button
        (click)="resetFilters()"
        class="
          w-full
          border
          border-gold
          text-gold
          hover:bg-gold
          hover:text-white
          text-sm
          py-2.5
          rounded-xl
          font-semibold
          transition
        "
      >

        <i
          class="
            fa-solid
            fa-rotate-left
            mr-2
          "
        ></i>

        Reset Filters

      </button>


    </div>

  </div>

</div>
