<section class="container mx-auto px-5 py-10">
  <!-- Heading -->

  <div class="text-center mb-8">
    <h2 class="text-3xl sm:text-4xl font-bold text-dark-navy">
      Explore Egypt By Destination
    </h2>

    <p class="mt-3 text-text-secondary">
      Choose your destination and discover available tours
    </p>
  </div>

  <!-- Cards -->

  <div
    class="flex gap-5 overflow-x-auto pb-6 pt-3 px-1 md:grid md:grid-cols-4 lg:grid-cols-5 md:overflow-visible scrollbar-hide"
  >
    <button
      *ngFor="let destination of destinations"
      (click)="selectDestination(destination)"
      class="group relative min-w-[220px] md:min-w-0 overflow-hidden rounded-3xl shadow-md transition-all duration-300 hover:-translate-y-2 hover:shadow-xl text-left ring-offset-4 ring-offset-white"
      [class.ring-4]="selectedDestination === destination.slug"
      [class.ring-gold]="selectedDestination === destination.slug"
    >
      <!-- Image -->

      <img
        [src]="destination.image"
        [alt]="destination.name"
        class="h-48 w-full object-cover transition-transform duration-500 group-hover:scale-110"
      />

      <!-- Overlay -->

      <div
        class="absolute inset-0 bg-gradient-to-t from-black/80 via-black/20 to-transparent"
      ></div>

      <!-- Content -->

      <div class="absolute bottom-0 left-0 right-0 p-5 text-white">
        <h3 class="text-xl font-bold">
          {{ destination.name }}
        </h3>

        <p class="mt-1 text-sm text-gray-200 line-clamp-2">
          {{ destination.description }}
        </p>
      </div>

      <!-- Active Badge -->

      <div
        *ngIf="selectedDestination === destination.slug"
        class="absolute top-4 right-4 bg-gold text-dark-navy px-3 py-1 rounded-full text-xs font-bold"
      >
        Selected
      </div>
    </button>
  </div>
</section>
