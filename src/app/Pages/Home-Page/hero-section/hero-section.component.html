<section
  class="relative overflow-hidden rounded-3xl shadow-2xl my-6 min-h-[650px] sm:min-h-[700px] lg:min-h-[720px]"
>
  <!-- Background -->

  <img
    [src]="heroSlides[currentSlide].image"
    [alt]="heroSlides[currentSlide].title1"
    class="absolute inset-0 h-full w-full object-cover transition-opacity duration-700"
    [class.opacity-0]="isFading"
    [class.opacity-100]="!isFading"
  />

  <!-- Overlay -->

  <div
    class="absolute inset-0 bg-gradient-to-b from-dark-navy/80 via-dark-navy/65 to-dark-navy/80 lg:bg-gradient-to-r lg:from-dark-navy/85 lg:via-dark-navy/60 lg:to-transparent"
  ></div>

  <!-- Content -->

  <div
    class="relative z-20 flex min-h-[650px] items-center sm:min-h-[700px] lg:min-h-[720px]"
  >
    <div class="mx-auto w-full max-w-7xl px-5 sm:px-8 lg:px-12">
      <div class="max-w-3xl">
        <!-- Badge -->

        <div
          class="inline-flex items-center gap-2 rounded-full border border-gold/40 bg-gold/10 px-4 py-2 text-xs font-semibold text-gold backdrop-blur-md sm:text-sm"
        >
          <i class="fa-solid fa-crown"></i>

          <span>
            {{ heroSlides[currentSlide].badge }}
          </span>
        </div>

        <!-- Title -->

        <h1
          class="mt-5 text-3xl font-extrabold leading-tight text-white sm:text-5xl lg:text-6xl"
        >
          {{ heroSlides[currentSlide].title1 }}

          <span class="text-gold">
            {{ heroSlides[currentSlide].title2 }}
          </span>

          {{ heroSlides[currentSlide].title3 }}
        </h1>

        <!-- Description -->

        <p
          class="mt-5 max-w-2xl text-sm leading-7 text-gray-200 sm:text-lg sm:leading-8"
        >
          {{ heroSlides[currentSlide].description }}
        </p>

        <!-- Rating -->

        <div class="mt-5 flex flex-wrap items-center gap-3 text-sm text-white">
          <div class="flex text-star">
            <i class="fa-solid fa-star"></i>
            <i class="fa-solid fa-star"></i>
            <i class="fa-solid fa-star"></i>
            <i class="fa-solid fa-star"></i>
            <i class="fa-solid fa-star-half-stroke"></i>
          </div>

          <span class="text-gray-200"> Rated 4.9/5 by travelers </span>
        </div>

        <!-- Buttons -->

        <div class="mt-7 flex flex-col gap-3 sm:flex-row">
          <button
            routerLink="/trips"
            class="flex items-center justify-center rounded-xl bg-gold px-7 py-3.5 text-sm font-bold text-dark-navy transition hover:bg-gold-hover"
          >
            <i class="fa-solid fa-plane-departure mr-2"></i>

            Explore Tours
          </button>

          <button
            routerLink="/map"
            class="flex items-center justify-center rounded-xl border border-white/30 bg-white/10 px-7 py-3.5 text-sm font-semibold text-white backdrop-blur-md transition hover:bg-white hover:text-dark-navy"
          >
            <i class="fa-solid fa-map-location-dot mr-2"></i>

            Destinations
          </button>
        </div>

        <!-- Stats -->

        <div class="mt-8 grid grid-cols-3 gap-3 max-w-xl">
          <div
            class="rounded-xl border border-white/20 bg-white/10 p-3 text-center backdrop-blur-md sm:p-4"
          >
            <h3 class="text-xl font-black text-gold sm:text-3xl">500+</h3>

            <p class="mt-1 text-[11px] text-gray-200 sm:text-sm">Tours</p>
          </div>

          <div
            class="rounded-xl border border-white/20 bg-white/10 p-3 text-center backdrop-blur-md sm:p-4"
          >
            <h3 class="text-xl font-black text-gold sm:text-3xl">25+</h3>

            <p class="mt-1 text-[11px] text-gray-200 sm:text-sm">Years</p>
          </div>

          <div
            class="rounded-xl border border-white/20 bg-white/10 p-3 text-center backdrop-blur-md sm:p-4"
          >
            <h3 class="text-xl font-black text-gold sm:text-3xl">50K+</h3>

            <p class="mt-1 text-[11px] text-gray-200 sm:text-sm">Travelers</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Arrows -->

  <button
    (click)="previousSlide()"
    class="hidden absolute left-6 top-1/2 z-30 h-12 w-12 -translate-y-1/2 items-center justify-center rounded-full border border-white/20 bg-white/10 text-white backdrop-blur-md hover:bg-gold hover:text-dark-navy lg:flex"
  >
    <i class="fa-solid fa-chevron-left"></i>
  </button>

  <button
    (click)="nextSlide()"
    class="hidden absolute right-6 top-1/2 z-30 h-12 w-12 -translate-y-1/2 items-center justify-center rounded-full border border-white/20 bg-white/10 text-white backdrop-blur-md hover:bg-gold hover:text-dark-navy lg:flex"
  >
    <i class="fa-solid fa-chevron-right"></i>
  </button>

  <!-- Indicators -->

  <div class="absolute bottom-5 left-1/2 z-30 flex -translate-x-1/2 gap-2">
    <button
      *ngFor="let slide of heroSlides; let i = index"
      (click)="changeSlide(i)"
    >
      <span
        class="block rounded-full transition-all"
        [ngClass]="
          currentSlide === i ? 'bg-gold w-10 h-2' : 'bg-white/70 w-2 h-2'
        "
      ></span>
    </button>
  </div>
</section>
