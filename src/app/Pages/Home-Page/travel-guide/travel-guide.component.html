<section
  class="bg-white
         rounded-[22px]
         shadow-card
         overflow-hidden
         hover:-translate-y-1
         transition-all
         duration-300">

  <!-- Image -->

  <img
    [src]="guide.image"
    [alt]="guide.title"
    class="w-full
           h-56
           object-cover">

  <!-- Content -->

  <div class="p-7">

    <h3
      class="text-dark-navy
             text-3xl
             font-bold">

      {{guide.title}}

    </h3>

    <p
      class="mt-4
             text-text-secondary
             leading-8">

      {{guide.description}}

    </p>

    <a
      [routerLink]="guide.link"
      class="inline-flex
             items-center
             gap-3
             mt-7
             px-6
             py-3
             rounded-xl
             border-2
             border-gold
             text-gold
             font-semibold
             transition-all
             duration-300
             hover:bg-gold
             hover:text-white
             hover:shadow-lg">

      {{guide.button}}

      <span
        class="transition-transform
               duration-300
               group-hover:translate-x-1">

        <i class="fa-solid fa-arrow-right "></i>

      </span>

    </a>

  </div>

</section>
