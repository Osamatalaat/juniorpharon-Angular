<section class="container mx-auto px-5 py-12 sm:py-16">
  <!-- ================= HEADER ================= -->

  <div class="mb-8 text-center sm:mb-10">
    <h2 class="text-2xl font-bold text-dark-navy sm:text-4xl">
      Things to Do in Egypt
    </h2>

    <p class="mt-3 text-sm leading-6 text-text-secondary sm:text-base">
      Add more excitement to your trip with our unique travel experiences.
    </p>
  </div>

  <!-- ================= ACTIVITIES ================= -->

  <div class="grid grid-cols-2 gap-3 sm:gap-5 md:grid-cols-4 lg:grid-cols-8">
    <a
      *ngFor="let item of activities"
      [routerLink]="['/trips/category', item.slug]"
      class="group block"
    >
      <div
        class="overflow-hidden rounded-xl border border-border bg-dark-navy shadow-sm transition-all duration-300 hover:-translate-y-1 hover:shadow-xl"
      >
        <!-- IMAGE -->

        <div class="overflow-hidden">
          <img
            [src]="item.image"
            [alt]="item.title"
            class="h-24 w-full object-cover transition-transform duration-500 group-hover:scale-110 sm:h-32"
          />
        </div>

        <!-- TITLE -->

        <div class="flex min-h-[48px] items-center justify-center px-2 py-3">
          <h3
            class="text-center text-xs font-semibold text-white transition group-hover:text-gold sm:text-sm"
          >
            {{ item.title }}
          </h3>
        </div>
      </div>
    </a>
  </div>
</section>
