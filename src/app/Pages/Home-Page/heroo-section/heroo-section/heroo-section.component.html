<section class="relative h-screen overflow-hidden ">

    <!-- Main Image -->
    <img
        [src]="selectedSlide.image"
        class="absolute inset-0 w-full h-full object-cover duration-500" />

    <!-- Overlay -->
    <div class="absolute inset-0 bg-black/40"></div>

    <!-- Content -->
    <div class="relative z-10 container mx-auto h-full flex items-center">

        <div class="w-1/2 text-white">

            <h1 class="text-6xl font-bold mb-5">
                {{selectedSlide.title}}
            </h1>

            <p class="text-lg mb-8">
                {{selectedSlide.description}}
            </p>

            <button
                class="bg-blue-500 px-8 py-3 rounded-lg">
                Explore
            </button>

        </div>

    </div>
    <button
    (click)="prev()"
    class="absolute right-25 top-1/2 -translate-y-1/2 z-30 w-12 h-12 rounded-full bg-white/30 flex items-center justify-center text-white hover:bg-white/50">

    <i class="fa-solid fa-chevron-left"></i>

</button>

<button
    (click)="next()"
    class="absolute right-6 top-1/2 -translate-y-1/2 z-30 w-12 h-12 rounded-full bg-white/30 flex items-center justify-center text-white hover:bg-white/50">

    <i class="fa-solid fa-chevron-right"></i>

</button>

    <!-- Thumbnails -->
    <div
        class="absolute bottom-8 right-10 flex gap-4 z-20">

        @for(slide of slides; track slide.id){

            <div

                (click)="changeSlide(slide)"

                class="cursor-pointer overflow-hidden rounded-2xl transition-all duration-300"

                [class.scale-110]="selectedSlide.id==slide.id"

                [class.ring-4]="selectedSlide.id==slide.id"

                [class.ring-yellow-400]="selectedSlide.id==slide.id">

                <img
                    [src]="slide.image"
                    class="w-44 h-52 object-cover">

            </div>

        }

    </div>

</section>
