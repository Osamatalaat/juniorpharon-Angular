<section>
  <div
    class="mb-8 rounded-3xl bg-gradient-to-r from-dark-navy to-blue-900 p-6 sm:p-8 text-white shadow-lg relative overflow-hidden"
  >
    <!-- Decoration -->
    <div
      class="absolute -right-10 -top-10 w-40 h-40 rounded-full bg-gold/20 blur-3xl"
    ></div>

    <div
      class="relative z-10 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-5"
    >
      <!-- Title -->

      <div>
        <div
          class="inline-flex items-center gap-2 text-gold text-sm font-semibold mb-3"
        >
          <i class="fa-solid fa-circle-question"></i>

          Help Center
        </div>

        <h2 class="text-2xl sm:text-3xl font-black">
          Frequently Asked Questions
        </h2>

        <p class="mt-2 text-gray-300 text-sm sm:text-base">
          Find answers about booking, tours, packages and travel services.
        </p>
      </div>

      <!-- Counter -->

      <div
        class="shrink-0 bg-white/10 backdrop-blur-md border border-white/20 rounded-2xl px-6 py-4 text-center"
      >
        <div class="text-3xl font-black text-gold">
          {{ filteredFaqs.length }}
        </div>

        <div class="text-xs text-gray-300 uppercase tracking-wide">
          Questions
        </div>
      </div>
    </div>
  </div>

  <!-- Empty -->

  <div
    *ngIf="filteredFaqs.length === 0"
    class="bg-gray-50 rounded-2xl p-10 text-center"
  >
    <i class="fa-solid fa-circle-question text-4xl text-gold"></i>

    <h3 class="mt-4 text-xl font-bold text-dark-navy">No questions found</h3>

    <p class="mt-2 text-gray-500">Try searching with another keyword</p>
  </div>

  <!-- Accordion -->

  <div class="space-y-4">
    <div
      *ngFor="let faq of filteredFaqs"
      class="bg-white border border-gray-200 rounded-2xl overflow-hidden shadow-sm transition hover:shadow-md"
    >
      <!-- Question -->

      <button
        (click)="toggle(faq.id)"
        class="w-full flex items-center justify-between gap-5 p-5 text-left"
      >
        <div class="flex items-center gap-4">
          <div
            class="w-10 h-10 rounded-full bg-gold/10 flex items-center justify-center shrink-0"
          >
            <i class="fa-solid fa-question text-gold"></i>
          </div>

          <span class="font-semibold text-dark-navy">
            {{ faq.question }}
          </span>
        </div>

        <i
          class="fa-solid fa-chevron-down transition-transform duration-300"
          [class.rotate-180]="openedId === faq.id"
        ></i>
      </button>

      <!-- Answer -->

      <div
        *ngIf="openedId === faq.id"
        class="px-5 pb-5 text-gray-600 leading-7 animate-fade"
      >
        {{ faq.answer }}
      </div>
    </div>
  </div>
</section>
