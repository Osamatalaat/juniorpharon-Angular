<!-- ===================================================== -->
<!-- BOOKING FORM -->
<!-- ===================================================== -->

<div class="p-5 md:p-6 bg-surface">

  <!-- ================================================= -->
  <!-- TITLE -->
  <!-- ================================================= -->

  <div class="mb-5">

    <h2
      class="
        text-2xl
        md:text-3xl
        font-bold
        text-heading
      "
    >
      Complete Your Booking
    </h2>

    <p
      class="
        text-sm
        text-text-secondary
        mt-1
      "
    >
      Fill in your details to complete your booking.
    </p>

  </div>


  <!-- ================================================= -->
  <!-- TRIP INFO -->
  <!-- ================================================= -->

  <div
    class="
      bg-light-gray
      border
      border-border
      rounded-xl
      p-3
      mb-5
      flex
      gap-3
      items-center
    "
  >

    <!-- Image -->

    <img
      [src]="item?.coverImage || item?.images?.[0]"
      class="
        w-20
        h-20
        md:w-24
        md:h-24
        rounded-xl
        object-cover
        shrink-0
      "
      alt="{{ item?.title || item?.name }}"
    />


    <!-- Info -->

    <div class="min-w-0">

      <h3
        class="
          font-bold
          text-base
          md:text-lg
          text-heading
          truncate
        "
      >

        {{ item?.title || item?.name }}

      </h3>


      <p
        class="
          text-text-secondary
          text-xs
          md:text-sm
          mt-1
          line-clamp-2
        "
      >

        {{ item?.description }}

      </p>

    </div>

  </div>


  <!-- ================================================= -->
  <!-- FORM -->
  <!-- ================================================= -->

  <div
    class="
      grid
      grid-cols-1
      md:grid-cols-2
      gap-3
    "
  >

    <!-- Name -->

    <div>

      <label
        class="
          block
          text-sm
          font-medium
          text-heading
          mb-1.5
        "
      >
        Full Name
      </label>

      <input
        type="text"
        [(ngModel)]="booking.customerName"
        placeholder="Enter your full name"
        class="
          w-full
          border
          border-border
          bg-white
          rounded-xl
          px-4
          py-2.5
          text-sm
          text-heading
          placeholder:text-text-secondary
          focus:outline-none
          focus:ring-2
          focus:ring-gold/30
          focus:border-gold
          transition
        "
      />

    </div>


    <!-- Phone -->

    <div>

      <label
        class="
          block
          text-sm
          font-medium
          text-heading
          mb-1.5
        "
      >
        Phone Number
      </label>

      <input
        type="text"
        [(ngModel)]="booking.phoneNumber"
        placeholder="Enter phone number"
        class="
          w-full
          border
          border-border
          bg-white
          rounded-xl
          px-4
          py-2.5
          text-sm
          text-heading
          placeholder:text-text-secondary
          focus:outline-none
          focus:ring-2
          focus:ring-gold/30
          focus:border-gold
          transition
        "
      />

    </div>


    <!-- Email -->

    <div>

      <label
        class="
          block
          text-sm
          font-medium
          text-heading
          mb-1.5
        "
      >
        Email Address
      </label>

      <input
        type="email"
        [(ngModel)]="booking.email"
        placeholder="Enter your email"
        class="
          w-full
          border
          border-border
          bg-white
          rounded-xl
          px-4
          py-2.5
          text-sm
          text-heading
          placeholder:text-text-secondary
          focus:outline-none
          focus:ring-2
          focus:ring-gold/30
          focus:border-gold
          transition
        "
      />

    </div>


    <!-- People -->

    <div>

      <label
        class="
          block
          text-sm
          font-medium
          text-heading
          mb-1.5
        "
      >
        Number of People
      </label>

      <input
        type="number"
        [(ngModel)]="booking.numberOfPeople"
        min="1"
        class="
          w-full
          border
          border-border
          bg-white
          rounded-xl
          px-4
          py-2.5
          text-sm
          text-heading
          focus:outline-none
          focus:ring-2
          focus:ring-gold/30
          focus:border-gold
          transition
        "
      />

    </div>


    <!-- Date -->

    <div class="md:col-span-2">

      <label
        class="
          block
          text-sm
          font-medium
          text-heading
          mb-1.5
        "
      >
        Start Date
      </label>

      <input
        type="date"
        [(ngModel)]="booking.startDate"
        class="
          w-full
          border
          border-border
          bg-white
          rounded-xl
          px-4
          py-2.5
          text-sm
          text-heading
          focus:outline-none
          focus:ring-2
          focus:ring-gold/30
          focus:border-gold
          transition
        "
      />

    </div>

  </div>


  <!-- ================================================= -->
  <!-- BOOKING SUMMARY -->
  <!-- ================================================= -->

  <div
    class="
      mt-5
      bg-gold-light
      border
      border-border-gold
      rounded-xl
      p-4
    "
  >

    <div
      class="
        flex
        items-center
        justify-between
        mb-3
      "
    >

      <h3
        class="
          font-bold
          text-base
          text-heading
        "
      >
        Booking Summary
      </h3>

      <i
        class="
          bx
          bx-receipt
          text-xl
          text-gold
        "
      ></i>

    </div>


    <div
      class="
        space-y-2
        text-sm
        text-text
      "
    >

      <!-- Price -->

      <div class="flex justify-between">

        <span>
          Price Per Person
        </span>

        <span
          class="
            font-semibold
            text-heading
          "
        >

          {{
            item?.price ||
            item?.pricePerPerson
          }}
          EGP

        </span>

      </div>


      <!-- People -->

      <div class="flex justify-between">

        <span>
          People
        </span>

        <span
          class="
            font-semibold
            text-heading
          "
        >

          {{ booking.numberOfPeople }}

        </span>

      </div>


      <!-- Divider -->

      <div
        class="
          border-t
          border-border-gold
          pt-2
          mt-2
          flex
          justify-between
          items-center
        "
      >

        <span
          class="
            font-bold
            text-heading
          "
        >
          Total
        </span>

        <span
          class="
            text-xl
            font-bold
            text-gold
          "
        >

          {{ totalPrice }} EGP

        </span>

      </div>

    </div>

  </div>


  <!-- ================================================= -->
  <!-- BUTTON -->
  <!-- ================================================= -->

  <div class="mt-5">

    <button
      (click)="confirmBooking()"
      class="
        w-full
        bg-gold
        hover:bg-gold-hover
        text-white
        py-3
        rounded-xl
        font-semibold
        transition
        shadow-sm
        flex
        items-center
        justify-center
        gap-2
      "
    >

      <i class="bx bxl-whatsapp text-xl"></i>

      Confirm & WhatsApp

    </button>

  </div>

</div>
